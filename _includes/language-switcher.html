{% if page.translations %}
  <nav class="language-switcher" aria-label="Article language">
    <span class="language-switcher__label">Language</span>
    <div class="language-switcher__options">
      <a
        href="{{ page.translations.zh | relative_url }}"
        lang="zh-CN"
        hreflang="zh-CN"
        class="language-switcher__option{% if page.lang == 'zh-CN' %} is-active{% endif %}"
        {% if page.lang == 'zh-CN' %}aria-current="page"{% endif %}
      >中文</a>
      <a
        href="{{ page.translations.en | relative_url }}"
        lang="en"
        hreflang="en"
        class="language-switcher__option{% if page.lang == 'en' %} is-active{% endif %}"
        {% if page.lang == 'en' %}aria-current="page"{% endif %}
      >English</a>
    </div>
  </nav>
{% endif %}
