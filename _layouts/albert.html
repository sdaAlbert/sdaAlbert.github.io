<!doctype html>
<html lang="{{ site.locale | default: 'zh-CN' | slice: 0, 2 }}" data-theme="light">
  <head>
    {% include base_path %}
    <meta charset="utf-8">
    {% include seo.html %}
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f0e8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ base_path }}/assets/css/albert.css">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }} Feed" href="{{ base_path }}/feed.xml">
  </head>
  <body>
    <a class="skip-link" href="#content">跳到正文</a>
    <header class="site-header">
      <a class="wordmark" href="{{ base_path }}/" aria-label="返回首页">
        <span class="wordmark-mark">A.</span>
        <span>Albert Tang</span>
      </a>
      <nav class="site-nav" aria-label="主导航">
        {% for link in site.data.navigation.main %}<a href="{{ base_path }}{{ link.url }}">{{ link.title }}</a>{% endfor %}
        <a href="https://github.com/{{ site.author.github }}" rel="me">GitHub ↗</a>
      </nav>
    </header>
    <main id="content">{{ content }}</main>
    <footer class="site-footer">
      <span>© {{ site.time | date: '%Y' }} Albert Tang</span>
      <span>写下来，才能继续想。</span>
    </footer>
  </body>
</html>
