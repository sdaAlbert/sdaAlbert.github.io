---
layout: albert
---
<article class="article shell">
  <header class="article-head">
    <a class="back-link" href="{{ '/blog/' | relative_url }}">← 所有文章</a>
    <p class="article-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y 年 %m 月 %d 日" }}</time>{% if page.read_time %}<span>·</span><span>{% include read-time.html %}</span>{% endif %}</p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="article-deck">{{ page.description }}</p>{% endif %}
  </header>
  <div class="article-body">{{ content }}</div>
  <footer class="article-end">
    <span>—</span><p>谢谢你读到这里。</p>
    <a href="mailto:{{ site.author.email }}?subject=关于《{{ page.title | uri_escape }}》">和我聊聊 ↗</a>
  </footer>
</article>
